<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js04</title>
    <style>
        body {
            font-size: 3rem;
            font-family: helvetica;
        }
    </style>
</head>
<body>
    <script type="text/javascript" language="javascript">

        // Declaració de variables
        var verd="verd";
        var vermell="vermell";
        var blau="blau";
        
        // Prompt per demanar infomarció/entrada de dades
        var colorintroduit=prompt("Escriu el color");
        
        // Comparem les dades unes amb altres

       if (colorintroduit == verd){
            document.write("Passa");
            document.body.style.backgroundColor="#3cb371";
            document.body.style.color="#FFF";
       }

       else if(colorintroduit == vermell){
            document.write("Stop");
            document.body.style.backgroundColor="#ff6347";
            document.body.style.color="#FFF";
       }

       else if(colorintroduit == blau){
            document.write("Extra");
            document.body.style.backgroundColor="#2D3047";
            document.body.style.color="#FFF";
       }

       else{
            document.write("Alerta");
            document.body.style.backgroundColor="#ffa500";
            document.body.style.color="#FFF";
       }
    </script>
</body>
</html>
